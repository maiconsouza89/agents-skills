name: security-scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runs on every PR, forks included: an expired allowlist entry fails before Snyk is even called.
      - name: Check the allowlist and build the ignore flags
        id: allowlist
        run: echo "flags=$(pnpm exec tsx tools/allowlist.ts)" >> "$GITHUB_OUTPUT"
      # Snyk needs SNYK_TOKEN, which forks do not receive: push to main and same-repo PRs only.
      - uses: astral-sh/setup-uv@v10.1.0
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Snyk Agent Scan
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        # --dangerously-run-mcp-servers: --ci now requires it (snyk-agent-scan 0.6.3). We scan a plain
        # skills directory, not an MCP config, so no stdio server is ever started - the flag is inert here.
        # X007 is the public tier's daily usage limit, not a finding: treat it as non-blocking so quota
        # exhaustion doesn't fail PRs, while any other failure (including real findings) still fails the job.
        # The check is deliberately narrow (exact tool-emitted sentence, both must match, fixed-string grep)
        # rather than a bare `grep X007`: skill content is attacker-controlled, and a loose substring match
        # on scan output could let a crafted skill spoof the quota message and suppress real findings.
        run: |
          set +e
          output=$(uvx snyk-agent-scan@latest skills --ci --dangerously-run-mcp-servers ${{ steps.allowlist.outputs.flags }} 2>&1)
          code=$?
          echo "$output"
          if [ "$code" -ne 0 ] \
            && echo "$output" | grep -qF "[X007 info]: Daily usage limit reached for the public version of Agent-Scan." \
            && echo "$output" | grep -qF "no mcp servers or skills found"; then
            echo "::warning::Snyk Agent Scan hit its public-tier daily usage limit (X007) before scanning anything; treating as non-blocking."
            exit 0
          fi
          exit "$code"

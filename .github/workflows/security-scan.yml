name: security-scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # Full history: the targets step diffs this PR against its base commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runs on every PR, forks included: an expired allowlist entry fails before Snyk is even called.
      - name: Check the allowlist and build the ignore flags
        id: allowlist
        run: echo "flags=$(pnpm exec tsx tools/allowlist.ts)" >> "$GITHUB_OUTPUT"
      # Rescanning the whole catalog on every PR is what exhausts the public tier's daily quota (X007),
      # so a PR only scans the skills it actually changed; push to main and workflow_dispatch still scan
      # everything. Path filters on the trigger would be cheaper but `scan` is a required check, and a
      # workflow skipped by a path filter never reports one, which would block every PR that touches no
      # skill: https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
      - name: Pick the scan targets
        id: targets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "paths=skills" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git show "$BASE_SHA:skills-registry.json" > "$RUNNER_TEMP/base-registry.json" 2>/dev/null; then
            echo "::warning::The pull request base has no skills-registry.json; scanning the whole catalog."
            echo "paths=skills" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          paths=$(git diff --name-only "$BASE_SHA" HEAD -- skills \
            | pnpm exec tsx tools/changed-skills.ts --base "$RUNNER_TEMP/base-registry.json")
          echo "Scan targets: ${paths:-<none>}"
          echo "paths=$paths" >> "$GITHUB_OUTPUT"
      # Snyk needs SNYK_TOKEN, which forks do not receive: push to main and same-repo PRs only.
      - uses: astral-sh/setup-uv@v10.1.0
        if: ${{ steps.targets.outputs.paths != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      - name: Snyk Agent Scan
        id: snyk
        if: ${{ steps.targets.outputs.paths != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          TARGETS: ${{ steps.targets.outputs.paths }}
        # $TARGETS is deliberately unquoted: it is a space-separated list of skill directories, and
        # tools/changed-skills.ts refuses to emit anything but `skills/<name>` so a crafted registry
        # entry cannot smuggle a shell word in.
        # --dangerously-run-mcp-servers: --ci now requires it (snyk-agent-scan 0.6.3). We scan a plain
        # skills directory, not an MCP config, so no stdio server is ever started - the flag is inert here.
        # X007 is the public tier's daily usage limit, not a finding: treat it as non-blocking so quota
        # exhaustion doesn't fail PRs, while any other failure (including real findings) still fails the job.
        # The check is deliberately narrow (exact tool-emitted sentence, both must match, fixed-string grep)
        # rather than a bare `grep X007`: skill content is attacker-controlled, and a loose substring match
        # on scan output could let a crafted skill spoof the quota message and suppress real findings.
        # `result` and `version` feed security-status.json below. The version is the first line the
        # scanner prints ("Snyk Agent Scan v0.6.3"), matched at line start with a strict shape; the
        # rest of the output echoes skill content and is never recorded.
        run: |
          set +e
          output=$(uvx snyk-agent-scan@latest $TARGETS --ci --dangerously-run-mcp-servers ${{ steps.allowlist.outputs.flags }} 2>&1)
          code=$?
          echo "$output"
          version=$(printf '%s\n' "$output" | grep -oE -m1 '^Snyk Agent Scan v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^Snyk Agent Scan v//')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The CLI hard-wraps its own text at terminal width, so the quota sentence can be split across
          # lines; collapse all whitespace/newlines before matching so the wrap point doesn't defeat the grep.
          squashed=$(printf '%s' "$output" | tr '\n' ' ' | tr -s ' ')
          if [ "$code" -ne 0 ] \
            && printf '%s' "$squashed" | grep -qF "[X007 info]: Daily usage limit reached for the public version of Agent-Scan." \
            && printf '%s' "$squashed" | grep -qF "no mcp servers or skills found"; then
            echo "::warning::Snyk Agent Scan hit its public-tier daily usage limit (X007) before scanning anything; treating as non-blocking."
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            echo "reason=quota" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" -eq 0 ]; then echo "result=passed" >> "$GITHUB_OUTPUT"; else echo "result=failed" >> "$GITHUB_OUTPUT"; fi
          exit "$code"
      # The site shows this run per skill and on /security, so it is recorded even when the scan
      # failed or never started (an empty result means a step before it failed). Pull requests are
      # left out: they scan only the skills they changed, and the site is built from main alone.
      - name: Record the scan status for the site
        if: ${{ always() && github.event_name != 'pull_request' }}
        env:
          RESULT: ${{ steps.snyk.outputs.result }}
          REASON: ${{ steps.snyk.outputs.reason }}
          VERSION: ${{ steps.snyk.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm exec tsx tools/security-status.ts --result "${RESULT:-failed}" --reason "$REASON" --commit "$GITHUB_SHA" --run-url "$RUN_URL" --scanner-version "$VERSION"
      - uses: actions/upload-artifact@v7
        if: ${{ always() && github.event_name != 'pull_request' }}
        with:
          name: security-status
          path: security-status.json
          if-no-files-found: error
          retention-days: 90

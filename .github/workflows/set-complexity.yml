name: set-complexity

# Manually dispatched: pnpm set-complexity in a Claude Code web session triggers this instead of
# writing the Complexity field directly, because the cloud sandbox's GitHub proxy rejects any
# GitHub API path that isn't repository-scoped ("repos/{owner}/{repo}/...") - including the
# Projects v2 REST endpoints under "users/{owner}/projectsV2/...", regardless of token. Dispatching
# this workflow is itself a repository-scoped REST call, so it passes the proxy; the write then
# happens here, on a runner with no such restriction.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number
        required: true
      level:
        description: Complexity level
        required: true
        type: choice
        options: [Low, Medium, High]

permissions: {}

concurrency:
  group: set-complexity-${{ github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  set:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_OWNER: maiconsouza89
      PROJECT_NUMBER: "5"
      ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
      TARGET_LEVEL: ${{ github.event.inputs.level }}
    steps:
      - name: Resolve the project, its Complexity field and the target option
        run: |
          gh api graphql -f query='
            query($login: String!, $number: Int!) {
              user(login: $login) {
                projectV2(number: $number) {
                  id
                  field(name: "Complexity") {
                    ... on ProjectV2SingleSelectField { id options { id name } }
                  }
                }
              }
            }' -f login="$PROJECT_OWNER" -F number="$PROJECT_NUMBER" > project.json
          echo "PROJECT_ID=$(jq -r .data.user.projectV2.id project.json)" >> "$GITHUB_ENV"
          echo "FIELD_ID=$(jq -r .data.user.projectV2.field.id project.json)" >> "$GITHUB_ENV"
          option_id=$(jq -r --arg s "$TARGET_LEVEL" '.data.user.projectV2.field.options[] | select(.name == $s) | .id' project.json)
          if [ -z "$option_id" ]; then
            echo "::error::No Complexity option named '$TARGET_LEVEL' on project $PROJECT_NUMBER"
            exit 1
          fi
          echo "OPTION_ID=$option_id" >> "$GITHUB_ENV"

      - name: Find the project item for the issue
        run: |
          gh api graphql -f query='
            query($owner: String!, $repo: String!, $n: Int!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $n) {
                  projectItems(first: 20) {
                    nodes { id project { id } }
                  }
                }
              }
            }' -f owner="${GITHUB_REPOSITORY_OWNER}" -f repo="${GITHUB_REPOSITORY#*/}" -F n="$ISSUE_NUMBER" > items.json
          item_id=$(jq -r --arg p "$PROJECT_ID" '.data.repository.issue.projectItems.nodes[] | select(.project.id == $p) | .id' items.json)
          if [ -z "$item_id" ]; then
            echo "::error::Issue #$ISSUE_NUMBER is not on project $PROJECT_NUMBER"
            exit 1
          fi
          echo "ITEM_ID=$item_id" >> "$GITHUB_ENV"

      - name: Set Complexity
        run: |
          gh api graphql --silent -f query='
            mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $p, itemId: $i, fieldId: $f, value: { singleSelectOptionId: $o }
              }) { projectV2Item { id } }
            }' -f p="$PROJECT_ID" -f i="$ITEM_ID" -f f="$FIELD_ID" -f o="$OPTION_ID"

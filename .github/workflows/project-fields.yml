name: project-fields

# Mirrors triage labels (priority:*, area:*, complexity:*) onto the matching single-select field of
# the project board. Labels are the write API of triage: the Claude Code routine that classifies
# new issues can reach labels and comments, but its GitHub proxy blocks Projects v2 regardless of
# token, so the field write happens here. The last label applied in a family wins, and its older
# siblings are removed from the issue. Label removals made with github.token start no new run.

on:
  issues:
    types: [labeled]

permissions:
  issues: write

# One group per issue and family: the routine applies all three families at once, and a single
# per-issue group would keep one pending run and cancel the rest. Within a family, a newer label
# replacing a pending older one is exactly "last applied wins".
concurrency:
  group: project-fields-${{ github.event.issue.number }}-${{ startsWith(github.event.label.name, 'priority:') && 'priority' || startsWith(github.event.label.name, 'area:') && 'area' || 'complexity' }}
  cancel-in-progress: false

jobs:
  mirror:
    if: startsWith(github.event.label.name, 'priority:') || startsWith(github.event.label.name, 'area:') || startsWith(github.event.label.name, 'complexity:')
    runs-on: ubuntu-latest
    env:
      PROJECT_OWNER: maiconsouza89
      PROJECT_NUMBER: "5"
    steps:
      # Event data is read from GITHUB_EVENT_PATH, never interpolated into the script: anyone who
      # can label an issue controls the label name.
      - name: Resolve the field and option for the label
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          label=$(jq -r .label.name "$GITHUB_EVENT_PATH")
          family=$(printf '%s' "${label%%:*}" | tr '[:upper:]' '[:lower:]')
          value=${label#*:}
          case "$family" in
            priority) field=Priority ;;
            area) field=Area ;;
            complexity) field=Complexity ;;
          esac
          gh api graphql -f query='
            query($login: String!, $number: Int!, $field: String!) {
              user(login: $login) {
                projectV2(number: $number) {
                  id
                  field(name: $field) {
                    ... on ProjectV2SingleSelectField { id options { id name } }
                  }
                }
              }
            }' -f login="$PROJECT_OWNER" -F number="$PROJECT_NUMBER" -f field="$field" > project.json
          option_id=$(jq -r --arg v "$value" '.data.user.projectV2.field.options[] | select((.name | ascii_downcase) == ($v | ascii_downcase)) | .id' project.json)
          if [ -z "$option_id" ]; then
            names=$(jq -r '[.data.user.projectV2.field.options[].name] | join(", ")' project.json)
            echo "::error::Label '$label' matches no $field option on project $PROJECT_NUMBER (valid: $names)"
            exit 1
          fi
          {
            echo "LABEL=$label"
            echo "FAMILY=$family"
            echo "PROJECT_ID=$(jq -r .data.user.projectV2.id project.json)"
            echo "FIELD_ID=$(jq -r .data.user.projectV2.field.id project.json)"
            echo "OPTION_ID=$option_id"
          } >> "$GITHUB_ENV"

      # addProjectV2ItemById returns the existing item when the issue is already on the board, so
      # there is no separate lookup and no race with project-board.yml adding it on open.
      - name: Set the field on the issue's project item
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          node_id=$(jq -r .issue.node_id "$GITHUB_EVENT_PATH")
          item_id=$(gh api graphql -f query='
            mutation($p: ID!, $c: ID!) {
              addProjectV2ItemById(input: { projectId: $p, contentId: $c }) { item { id } }
            }' -f p="$PROJECT_ID" -f c="$node_id" --jq .data.addProjectV2ItemById.item.id)
          gh api graphql --silent -f query='
            mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $p, itemId: $i, fieldId: $f, value: { singleSelectOptionId: $o }
              }) { projectV2Item { id } }
            }' -f p="$PROJECT_ID" -f i="$item_id" -f f="$FIELD_ID" -f o="$OPTION_ID"

      # Siblings come from the labels in the event payload, not from the issue's current labels: a
      # label of the same family applied after this event is newer and is left for its own run.
      - name: Remove older labels of the same family
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(jq -r .issue.number "$GITHUB_EVENT_PATH")
          siblings=$(jq -r --arg label "$LABEL" --arg prefix "$FAMILY:" \
            '.issue.labels[].name | select((ascii_downcase | startswith($prefix)) and . != $label)' "$GITHUB_EVENT_PATH")
          while IFS= read -r sibling; do
            [ -n "$sibling" ] || continue
            encoded=$(jq -rn --arg s "$sibling" '$s | @uri')
            if ! body=$(gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$number/labels/$encoded"); then
              status=$(printf '%s' "$body" | jq -r 'if type == "object" then .status // "" else "" end' 2>/dev/null || true)
              if [ "$status" != "404" ]; then
                echo "::error::Could not remove '$sibling' from issue #$number"
                exit 1
              fi
              echo "'$sibling' was already removed from issue #$number"
            # A successful call is not a removal. gh follows a redirect and reissues it as a GET
            # (measured against gh 2.92.0), so the call exits 0 and answers the label list
            # unchanged. The response is the evidence, not the exit code.
            elif printf '%s' "$body" | jq -e --arg s "$sibling" 'any(.[]?; .name == $s)' >/dev/null 2>&1; then
              echo "::error::'$sibling' is still on issue #$number after the removal call"
              exit 1
            fi
          done <<< "$siblings"
